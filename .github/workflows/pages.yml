name: Deploy Mostor to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build website
        env:
          VITE_TURN_URL: ${{ vars.MOSTOR_TURN_URL }}
          VITE_TURN_USERNAME: ${{ vars.MOSTOR_TURN_USERNAME }}
          VITE_TURN_CREDENTIAL: ${{ vars.MOSTOR_TURN_CREDENTIAL }}
        run: npm run build

      - name: Prepare maintenance page
        run: |
          cp 'Техперерыв.png' maintenance/
          cp src/games-hub.mjs maintenance/games-hub.mjs
          cp src/nes-keys.mjs maintenance/nes-keys.mjs
          cp src/nes-rom.mjs maintenance/nes-rom.mjs
          cp src/game-recordings.mjs maintenance/game-recordings.mjs
          cp src/rom-platforms.mjs maintenance/rom-platforms.mjs
          cp node_modules/jsnes/dist/jsnes.min.js maintenance/jsnes.min.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: maintenance

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
